<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Convert HTML to Markdown locally in your browser with Rust and WebAssembly. Paste HTML or open a file, then copy or download Markdown.">
  <title>HTML to Markdown - Rust WASM</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; background: #0d1117; color: #e6edf3; }
    body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 1.3rem 1.5rem; border-bottom: 1px solid #30363d; }
    nav { margin-bottom: 1rem; font-size: .85rem; }
    a { color: #58a6ff; }
    h1 { font-size: 1.6rem; margin: 0 0 .5rem; letter-spacing: -.03em; }
    p { color: #8b949e; margin: 0; font-size: .95rem; line-height: 1.5; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .7rem; padding: 1rem 1.5rem; }
    button, select { font: inherit; font-size: .9rem; border: 1px solid #484f58; border-radius: 6px; padding: .5rem .75rem; color: #e6edf3; background: #21262d; }
    button { cursor: pointer; }
    button:hover:enabled { border-color: #58a6ff; }
    button:disabled { opacity: .45; cursor: default; }
    button.primary { background: #238636; border-color: #2ea043; }
    :focus-visible { outline: 2px solid #58a6ff; outline-offset: 3px; }
    .option { font-size: .85rem; color: #8b949e; display: flex; align-items: center; gap: .5rem; }
    .spacer { flex: 1; }
    main { padding: 0 1.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; flex: 1; }
    .pane { display: flex; flex-direction: column; min-width: 0; }
    .pane label { font-size: .8rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: .75rem 1rem; background: #161b22; border: 1px solid #30363d; border-bottom: 0; border-radius: 8px 8px 0 0; }
    textarea { flex: 1; width: 100%; min-height: 52dvh; resize: vertical; padding: 1rem; background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 0 0 8px 8px; font: .9rem/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; tab-size: 4; }
    #output { background: #161b22; }
    footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem; padding: 1rem 1.5rem; font-size: .8rem; color: #8b949e; }
    #status.error { color: #ff7b72; }
    body.dragging textarea { border-color: #58a6ff; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } textarea { min-height: 34dvh; } .spacer { display: none; } header, .toolbar, footer { padding-left: 1rem; padding-right: 1rem; } main { padding: 0 1rem; } }
  </style>
</head>
<body>
  <header>
    <nav><a href="../">← All WASM tools</a></nav>
    <h1>HTML → Markdown</h1>
    <p>Paste HTML or open a file. Convert headings, lists, links, code, and tables. Everything stays in your browser.</p>
  </header>
  <div class="toolbar">
    <button id="open" disabled>Open HTML</button>
    <input id="file" type="file" accept=".html,.htm,text/html" hidden>
    <button id="sample" disabled>Load example</button>
    <button id="clear" disabled>Clear</button>
    <label class="option" for="headings">Headings <select id="headings" disabled><option value="atx"># ATX</option><option value="setext">Setext</option></select></label>
    <label class="option" for="links">Links <select id="links" disabled><option value="inline">Inline</option><option value="reference">Reference</option></select></label>
    <span class="spacer"></span>
    <button id="copy" disabled>Copy Markdown</button>
    <button class="primary" id="download" disabled>Download .md</button>
  </div>
  <main>
    <section class="pane"><label for="input">HTML input</label><textarea id="input" spellcheck="false" placeholder="Paste HTML here, or drop an HTML file…" disabled></textarea></section>
    <section class="pane"><label for="output">Markdown output</label><textarea id="output" spellcheck="false" readonly placeholder="Your Markdown will appear here…"></textarea></section>
  </main>
  <footer><span id="status" role="status" aria-live="polite">Loading converter…</span><span>Rust + WebAssembly · No uploads</span></footer>
  <noscript>This tool requires JavaScript and WebAssembly to run the local converter.</noscript>
  <script type="module">
    import init, { html_to_markdown } from './pkg/192169e7567419dba6af/html_to_markdown.min.js';

    const $ = (id) => document.getElementById(id);
    const input = $('input');
    const output = $('output');
    const status = $('status');
    const encoder = new TextEncoder();
    const maxBytes = 5 * 1024 * 1024;
    let timer;
    let ready = false;
    let fileVersion = 0;
    let filename = 'converted';
    const sample = `<article>
  <h1>From HTML to Markdown</h1>
  <p>Keep your <strong>ideas</strong>, simplify your <em>formatting</em>.</p>
  <h2>A small checklist</h2>
  <ul>
    <li>Paste HTML or open a saved page</li>
    <li>Copy the result or download a Markdown file</li>
  </ul>
  <blockquote><p>All conversion happens locally in your browser.</p></blockquote>
  <pre><code class="language-rust">fn main() {
    println!("Hello, Markdown!");
}</code></pre>
  <table>
    <tr><th>Input</th><th>Output</th></tr>
    <tr><td>HTML</td><td>Markdown</td></tr>
  </table>
  <p>Built with <a href="https://www.rust-lang.org/">Rust</a> &amp; WebAssembly.</p>
</article>`;

    function message(text, error = false) {
      status.textContent = text;
      status.classList.toggle('error', error);
    }

    function convert() {
      clearTimeout(timer);
      if (!ready) return;
      try {
        const bytes = encoder.encode(input.value).length;
        if (bytes > maxBytes) throw new Error('Please use HTML smaller than 5 MiB.');
        const start = performance.now();
        output.value = html_to_markdown(input.value, $('headings').value === 'setext', $('links').value === 'reference');
        $('copy').disabled = $('download').disabled = !output.value;
        message(input.value ? `${bytes.toLocaleString()} bytes HTML → ${encoder.encode(output.value).length.toLocaleString()} bytes Markdown · ${Math.round(performance.now() - start)} ms` : 'Ready — paste HTML or open a file.');
      } catch (error) {
        output.value = '';
        $('copy').disabled = $('download').disabled = true;
        message(String(error.message || error), true);
      }
    }

    async function openFile(file) {
      if (!ready || !file) return;
      const version = ++fileVersion;
      if (file.size > maxBytes) {
        message('Please use an HTML file smaller than 5 MiB.', true);
        return;
      }
      try {
        const text = await file.text();
        if (version !== fileVersion) return;
        filename = file.name.replace(/\.[^.]+$/, '') || 'converted';
        input.value = text;
        convert();
      } catch (error) {
        if (version === fileVersion) message(`Could not read file: ${error.message || error}`, true);
      }
    }

    input.addEventListener('input', () => {
      fileVersion++;
      filename = 'converted';
      // Invalidate the previous result while a new conversion is pending.
      $('copy').disabled = $('download').disabled = true;
      clearTimeout(timer);
      timer = setTimeout(convert, 180);
    });
    for (const id of ['headings', 'links']) $(id).addEventListener('change', convert);
    $('open').addEventListener('click', () => $('file').click());
    $('file').addEventListener('change', () => { openFile($('file').files[0]); $('file').value = ''; });
    $('sample').addEventListener('click', () => { fileVersion++; filename = 'example'; input.value = sample; convert(); });
    $('clear').addEventListener('click', () => { fileVersion++; filename = 'converted'; input.value = ''; convert(); input.focus(); });
    $('copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(output.value);
        message('Markdown copied to clipboard.');
      } catch {
        output.focus();
        output.select();
        message('Clipboard unavailable. The Markdown is selected; use your keyboard to copy.');
      }
    });
    $('download').addEventListener('click', () => {
      const url = URL.createObjectURL(new Blob([output.value], { type: 'text/markdown;charset=utf-8' }));
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = `${filename}.md`;
      anchor.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      message('Markdown downloaded.');
    });
    document.addEventListener('dragover', (event) => {
      if (!event.dataTransfer.types.includes('Files')) return;
      event.preventDefault();
      document.body.classList.add('dragging');
    });
    document.addEventListener('dragleave', (event) => { if (!event.relatedTarget) document.body.classList.remove('dragging'); });
    document.addEventListener('drop', (event) => {
      if (!event.dataTransfer.files.length) return;
      event.preventDefault();
      document.body.classList.remove('dragging');
      openFile(event.dataTransfer.files[0]);
    });

    try {
      await init();
      ready = true;
      for (const id of ['input', 'open', 'sample', 'clear', 'headings', 'links']) $(id).disabled = false;
      input.value = sample;
      filename = 'example';
      convert();
    } catch (error) {
      message('Could not load the WebAssembly converter. Please reload the page. ' + String(error.message || error), true);
    }
  </script>
</body>
</html>
